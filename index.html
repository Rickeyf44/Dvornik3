<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дворник-Магнат 3D | Roblox Simulator</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Шрифт Rubik для мультяшного Roblox-стиля -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Rubik', sans-serif;
            background-color: #38bdf8;
        }
        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* Мультяшные кнопки и плашки в стиле Roblox */
        .rbx-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            border: 3px solid #334155;
            box-shadow: 0 6px 0 #0f172a;
            border-radius: 18px;
        }
        .rbx-btn {
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            border-bottom-width: 5px;
        }
        .rbx-btn:active {
            transform: translateY(4px);
            border-bottom-width: 1px;
        }
        .text-stroke {
            text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 0 3px 0 rgba(0,0,0,0.6);
        }
        /* Виртуальный джойстик */
        #joystick-zone {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 130px;
            height: 130px;
            z-index: 20;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            border: 3px solid rgba(255, 255, 255, 0.45);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystick-knob {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffffff, #cbd5e1);
            border: 3px solid #1e293b;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            position: absolute;
            pointer-events: none;
        }
        /* Всплывающие числа очков */
        .floating-pop {
            position: fixed;
            pointer-events: none;
            font-weight: 900;
            z-index: 30;
            animation: floatUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes floatUp {
            0% { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
            20% { transform: translate(-50%, -15px) scale(1.15); opacity: 1; }
            100% { transform: translate(-50%, -75px) scale(0.95); opacity: 0; }
        }
        /* Анимация пульсации индикатора */
        @keyframes pulseFast {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }
        .pulse-fast {
            animation: pulseFast 0.7s infinite;
        }
    </style>
</head>
<body>

    <!-- 3D Канвас -->
    <canvas id="game-canvas"></canvas>

    <!-- Верхний HUD (Интерфейс игрока) -->
    <div class="fixed top-0 left-0 right-0 z-20 p-3 flex flex-col gap-2 pointer-events-none">
        <div class="flex items-center justify-between gap-2 max-w-2xl mx-auto w-full">
            <!-- Монеты -->
            <div class="rbx-panel px-3 py-1.5 flex items-center gap-2 pointer-events-auto">
                <span class="text-2xl">🪙</span>
                <div>
                    <div class="text-[10px] uppercase tracking-wider text-amber-300 font-bold leading-none">Монеты</div>
                    <div id="ui-coins" class="text-lg sm:text-xl font-black text-white text-stroke leading-tight">0</div>
                </div>
            </div>

            <!-- Ранг / Титул -->
            <div class="rbx-panel px-3 py-1.5 flex-1 text-center">
                <div class="text-[10px] uppercase tracking-wider text-sky-300 font-bold leading-none">Ранг дворника</div>
                <div id="ui-rank" class="text-xs sm:text-sm font-black text-white truncate mt-0.5">🌱 Новичок двора</div>
            </div>

            <!-- Кнопки Магазина и Звука -->
            <div class="flex items-center gap-1.5 pointer-events-auto">
                <button id="btn-open-shop" class="rbx-btn bg-emerald-500 hover:bg-emerald-400 border-emerald-700 text-white font-black px-3 py-2 rounded-2xl text-sm flex items-center gap-1 shadow-lg">
                    <span>🛒</span>
                    <span class="hidden sm:inline">МАГАЗИН</span>
                </button>
                <button id="btn-sound" class="rbx-btn bg-slate-700 hover:bg-slate-600 border-slate-900 text-white font-black w-10 h-10 rounded-2xl flex items-center justify-center text-lg shadow-lg" title="Звук">
                    🔊
                </button>
            </div>
        </div>

        <!-- Прогресс-бар Рюкзака -->
        <div class="max-w-md mx-auto w-full rbx-panel p-2 flex flex-col gap-1">
            <div class="flex justify-between items-center text-xs font-extrabold px-1">
                <span class="text-amber-200 flex items-center gap-1">🎒 РЮКЗАК</span>
                <span id="ui-bag-text" class="text-white">0 / 10</span>
            </div>
            <div class="w-full h-4 bg-slate-900 rounded-full overflow-hidden border-2 border-slate-700 p-0.5">
                <div id="ui-bag-bar" class="h-full rounded-full transition-all duration-150 bg-gradient-to-r from-amber-500 via-yellow-400 to-lime-400" style="width: 0%;"></div>
            </div>
            <div id="ui-bag-full-hint" class="hidden text-center text-[11px] font-black text-rose-400 uppercase tracking-wide pulse-fast">
                ⚠️ РЮКЗАК ПОЛОН! БЕГИ В ЗОНУ ПЕРЕРАБОТКИ!
            </div>
        </div>
    </div>

    <!-- Подсказка навигации к базе или магазину -->
    <div id="ui-nav-pill" class="fixed top-32 left-1/2 -translate-x-1/2 z-10 pointer-events-none hidden">
        <div class="bg-emerald-600/90 border-2 border-white text-white text-xs font-black px-3 py-1 rounded-full shadow-lg flex items-center gap-1.5">
            <span>♻️</span>
            <span id="ui-nav-text">Сдай груз в зелёный круг!</span>
        </div>
    </div>

    <!-- Левый Виртуальный Джойстик (Тачскрин) -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <!-- Правые Кнопки Действий (Буст + Прыжок) -->
    <div class="fixed bottom-6 right-5 z-20 flex flex-col items-end gap-3">
        <!-- Кнопка Ускорения (Спринт) -->
        <button id="btn-boost" class="rbx-btn w-16 h-16 rounded-full bg-amber-400 active:bg-amber-300 border-amber-700 text-slate-950 font-black flex flex-col items-center justify-center shadow-xl">
            <span class="text-2xl leading-none">⚡</span>
            <span class="text-[10px] font-black uppercase mt-0.5">БУСТ</span>
        </button>
        <!-- Кнопка Прыжка -->
        <button id="btn-jump" class="rbx-btn w-20 h-20 rounded-full bg-sky-400 active:bg-sky-300 border-sky-700 text-slate-950 font-black flex flex-col items-center justify-center shadow-xl">
            <span class="text-3xl leading-none">⬆️</span>
            <span class="text-[11px] font-black uppercase mt-0.5">ПРЫЖОК</span>
        </button>
    </div>

    <!-- Модальное Окно Магазина Апгрейдов -->
    <div id="shop-modal" class="fixed inset-0 z-40 bg-slate-950/75 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="rbx-panel w-full max-w-md max-h-[85vh] flex flex-col overflow-hidden border-amber-400">
            <!-- Шапка магазина -->
            <div class="bg-gradient-to-r from-amber-500 to-orange-500 p-3.5 flex items-center justify-between border-b-4 border-amber-700">
                <div class="flex items-center gap-2">
                    <span class="text-2xl">🏪</span>
                    <div>
                        <h2 class="text-lg font-black text-white text-stroke leading-none">МАГАЗИН МАГНАТА</h2>
                        <p class="text-[11px] font-bold text-amber-100">Прокачай экипировку и питомца!</p>
                    </div>
                </div>
                <button id="btn-close-shop" class="rbx-btn bg-rose-500 border-rose-800 text-white font-black w-9 h-9 rounded-xl flex items-center justify-center text-lg">
                    ✕
                </button>
            </div>

            <!-- Баланс внутри магазина -->
            <div class="bg-slate-900/90 px-4 py-2 flex justify-between items-center border-b border-slate-700">
                <span class="text-xs font-bold text-slate-300">Твой баланс:</span>
                <span class="text-base font-black text-amber-400 flex items-center gap-1">🪙 <span id="shop-coins">0</span></span>
            </div>

            <!-- Список товаров -->
            <div id="shop-items-list" class="p-3 overflow-y-auto space-y-2.5 flex-1">
                <!-- Генерируется через JS -->
            </div>

            <!-- Футер магазина -->
            <div class="p-2.5 bg-slate-900 border-t border-slate-800 flex justify-between items-center text-[11px] text-slate-400">
                <span>Прогресс сохраняется авто</span>
                <button id="btn-reset-save" class="text-rose-400 underline font-bold">Сбросить</button>
            </div>
        </div>
    </div>

    <!-- Всплывающее уведомление (вместо alert) -->
    <div id="toast-box" class="fixed bottom-36 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 translate-y-4">
        <div id="toast-text" class="bg-slate-900/95 border-2 border-amber-400 text-white font-black text-sm px-4 py-2 rounded-2xl shadow-2xl text-center">
            Уведомление
        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. TELEGRAM MINI APPS SDK ИНТЕГРАЦИЯ
         * ============================================================================
         */
        const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
        if (tg) {
            try {
                tg.ready();
                tg.expand();
                if (tg.setHeaderColor) tg.setHeaderColor('#0f172a');
                if (tg.setBackgroundColor) tg.setBackgroundColor('#38bdf8');
            } catch (e) {
                console.warn('TG WebApp init warning:', e);
            }
        }

        function triggerHaptic(type = 'light') {
            if (!tg || !tg.HapticFeedback) return;
            try {
                if (type === 'light' || type === 'medium' || type === 'heavy') {
                    tg.HapticFeedback.impactOccurred(type);
                } else if (type === 'success' || type === 'warning' || type === 'error') {
                    tg.HapticFeedback.notificationOccurred(type);
                }
            } catch (e) {}
        }

        /**
         * ============================================================================
         * 2. СИНТЕЗАТОР ЗВУКОВ (WEB AUDIO API БЕЗ ВНЕШНИХ ФАЙЛОВ)
         * ============================================================================
         */
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }
            playPop(pitchMult = 1) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220 * pitchMult, now);
                osc.frequency.exponentialRampToValueAtTime(580 * pitchMult, now + 0.11);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.13);
            }
            playCoin() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                [880, 1318.5].forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.06);
                    gain.gain.setValueAtTime(0.22, now + i * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.06 + 0.18);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.06);
                    osc.stop(now + i * 0.06 + 0.19);
                });
            }
            playJump() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(160, now);
                osc.frequency.exponentialRampToValueAtTime(420, now + 0.16);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.17);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.18);
            }
            playUpgrade() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.5];
                notes.forEach((f, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + idx * 0.07);
                    gain.gain.setValueAtTime(0.22, now + idx * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.07 + 0.22);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.07);
                    osc.stop(now + idx * 0.07 + 0.24);
                });
            }
        }
        const sfx = new SoundFX();

        /**
         * ============================================================================
         * 3. СОСТОЯНИЕ ИГРЫ И ПРОГРЕССИЯ (СОХРАНЕНИЕ В LOCALSTORAGE)
         * ============================================================================
         */
        const SAVE_KEY = 'dvornik_tycoon_3d_v1';

        const RANKS = [
            { minEarned: 0, title: '🌱 Новичок двора' },
            { minEarned: 150, title: '🧹 Боец с совком' },
            { minEarned: 600, title: '🚜 Мастер чистоты' },
            { minEarned: 2000, title: '👑 Король газонов' },
            { minEarned: 6500, title: '💎 Золотой ассенизатор' },
            { minEarned: 20000, title: '🚀 Галактический Магнат' }
        ];

        const BAG_TIERS = [
            { name: 'Пакет из Пятёрочки', cap: 10, cost: 0, color: 0xf8fafc, scale: 0.75 },
            { name: 'Школьный ранец', cap: 22, cost: 60, color: 0x3b82f6, scale: 0.95 },
            { name: 'Походный баул', cap: 45, cost: 220, color: 0x10b981, scale: 1.15 },
            { name: 'Бак Дворника Pro', cap: 90, cost: 750, color: 0xf59e0b, scale: 1.35 },
            { name: 'Турбо-Контейнер X', cap: 180, cost: 2400, color: 0xa855f7, scale: 1.55 },
            { name: 'Чёрная Дыра 9000', cap: 400, cost: 7500, color: 0xef4444, scale: 1.8 }
        ];

        const TOOL_TIERS = [
            { name: 'Руки и совок', radius: 2.3, mult: 1, cost: 0 },
            { name: 'Мега-лопата', radius: 3.1, mult: 1.5, cost: 80 },
            { name: 'Садовый пылесос', radius: 4.0, mult: 2.2, cost: 300 },
            { name: 'Магнит чистоты', radius: 5.2, mult: 3.5, cost: 1100 },
            { name: 'Грави-пушка Эко', radius: 6.8, mult: 5.5, cost: 4000 }
        ];

        const BOOT_TIERS = [
            { name: 'Обычные кеды', speed: 11, cost: 0 },
            { name: 'Кроссы с рынка', speed: 13.5, cost: 50 },
            { name: 'Пружинные боты', speed: 16.5, cost: 200 },
            { name: 'Реактивные сапоги', speed: 20, cost: 850 },
            { name: 'Ботинки Флэша', speed: 24, cost: 3200 }
        ];

        const PET_TIERS = [
            { name: 'Нет питомца', mult: 1, autoCollect: false, cost: 0, color: null },
            { name: 'Кубический Пёс Бобик', mult: 1.5, autoCollect: true, cost: 180, color: 0xd97706 },
            { name: 'Золотой Дрон-Пылесос', mult: 2.2, autoCollect: true, cost: 950, color: 0xfacc15 },
            { name: 'Кибер-Жук Неон', mult: 3.5, autoCollect: true, cost: 4500, color: 0x22d3ee }
        ];

        let state = {
            coins: 0,
            totalEarned: 0,
            bagLoad: 0,
            bagLevel: 0,
            toolLevel: 0,
            bootLevel: 0,
            petLevel: 0
        };

        function loadSave() {
            try {
                const raw = localStorage.getItem(SAVE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    state = { ...state, ...parsed };
                }
            } catch (e) {}
        }

        function saveGame() {
            try {
                localStorage.setItem(SAVE_KEY, JSON.stringify(state));
            } catch (e) {}
        }

        loadSave();

        /**
         * ============================================================================
         * 4. ИНИЦИАЛИЗАЦИЯ THREE.JS СЦЕНЫ (ВОКСЕЛЬНЫЙ МИР В СТИЛЕ ROBLOX)
         * ============================================================================
         */
        const canvas = document.getElementById('game-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x60a5fa);
        scene.fog = new THREE.FogExp2(0x60a5fa, 0.009);

        const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 18, 22);

        // Освещение (яркий солнечный день)
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x4ade80, 0.72);
        hemiLight.position.set(0, 50, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.95);
        dirLight.position.set(25, 42, 22);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 5;
        dirLight.shadow.camera.far = 110;
        const d = 38;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // Вспомогательная функция создания воксельных коробок
        function createBox(w, h, d, color, castShadow = true, receiveShadow = true) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshLambertMaterial({ color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = castShadow;
            mesh.receiveShadow = receiveShadow;
            return mesh;
        }

        /**
         * ============================================================================
         * 5. ПОСТРОЕНИЕ КАРТЫ ПАРКА / ДВОРА
         * ============================================================================
         */
        const WORLD_RADIUS = 32;

        // Основной зелёный газон
        const ground = createBox(WORLD_RADIUS * 2 + 8, 1, WORLD_RADIUS * 2 + 8, 0x4ade80, false, true);
        ground.position.y = -0.5;
        scene.add(ground);

        // Декоративные плитки газона (шахматный эффект как в Roblox)
        const patchGeo = new THREE.BoxGeometry(6, 0.05, 6);
        const patchMat = new THREE.MeshLambertMaterial({ color: 0x22c55e });
        for (let x = -27; x <= 27; x += 12) {
            for (let z = -27; z <= 27; z += 12) {
                const p = new THREE.Mesh(patchGeo, patchMat);
                p.position.set(x, 0.01, z);
                p.receiveShadow = true;
                scene.add(p);
            }
        }

        // Тропинки из серой плитки
        const path1 = createBox(5, 0.08, 44, 0xcbd5e1, false, true);
        path1.position.set(0, 0.02, 0);
        scene.add(path1);

        const path2 = createBox(44, 0.08, 5, 0xcbd5e1, false, true);
        path2.position.set(0, 0.02, 0);
        scene.add(path2);

        // Забор по периметру парка
        const fenceGroup = new THREE.Group();
        const bound = WORLD_RADIUS + 1;
        for (let i = -bound; i <= bound; i += 4) {
            [
                [i, bound],
                [i, -bound],
                [bound, i],
                [-bound, i]
            ].forEach(([fx, fz]) => {
                const post = createBox(0.7, 2.2, 0.7, 0x92400e);
                post.position.set(fx, 1.1, fz);
                fenceGroup.add(post);
            });
        }
        // Перекладины забора
        const railN = createBox(bound * 2, 0.35, 0.3, 0xb45309);
        railN.position.set(0, 1.4, -bound);
        const railS = railN.clone();
        railS.position.z = bound;
        const railE = createBox(0.3, 0.35, bound * 2, 0xb45309);
        railE.position.set(bound, 1.4, 0);
        const railW = railE.clone();
        railW.position.x = -bound;
        fenceGroup.add(railN, railS, railE, railW);
        scene.add(fenceGroup);

        // Блочные деревья в стиле Roblox
        const obstacles = []; // Коллизии для деревьев и построек
        function createVoxelTree(x, z) {
            const tree = new THREE.Group();
            const trunk = createBox(1.4, 4.2, 1.4, 0x78350f);
            trunk.position.y = 2.1;

        function createTextSignSprite(text, bgColor = '#0f172a', borderColor = '#22c55e') {
            const c = document.createElement('canvas');
            c.width = 512;
            c.height = 128;
            const ctx = c.getContext('2d');
            ctx.fillStyle = bgColor;
            ctx.beginPath();
            ctx.roundRect(12, 12, 488, 104, 28);
            ctx.fill();
            ctx.lineWidth = 10;
            ctx.strokeStyle = borderColor;
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.font = '900 40px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 66);

            const tex = new THREE.CanvasTexture(c);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(7.5, 1.9, 1);
            return sprite;
        }

            // 3-этажная воксельная пирамидка в стиле Roblox

        /**

        const input = {

        // Клавиатура

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') triggerJump();
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.boostActive = true;
        });
        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.boostActive = false;
        });

        function updateKeyboardInput() {
            let kx = 0, kz = 0;
            if (keys['KeyW'] || keys['ArrowUp']) kz -= 1;
            if (keys['KeyS'] || keys['ArrowDown']) kz += 1;
            if (keys['KeyA'] || keys['ArrowLeft']) kx -= 1;
            if (keys['KeyD'] || keys['ArrowRight']) kx += 1;
            if (kx !== 0 || kz !== 0) {
                const len = Math.hypot(kx, kz);
                input.moveX = kx / len;
                input.moveZ = kz / len;
            } else if (!joyTouchId) {
                input.moveX = 0;
                input.moveZ = 0;
            }
        }

        // Виртуальный тач-джойстик
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyTouchId = null;
        const JOY_MAX_R = 42;

        function handleJoystickMove(clientX, clientY) {
            const rect = joyZone.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let dx = clientX - cx;
            let dy = clientY - cy;
            const dist = Math.hypot(dx, dy);
            if (dist > JOY_MAX_R) {
                dx = (dx / dist) * JOY_MAX_R;
                dy = (dy / dist) * JOY_MAX_R;
            }
            joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            input.moveX = dx / JOY_MAX_R;
            input.moveZ = dy / JOY_MAX_R;
        }

        joyZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            sfx.init();
            const touch = e.changedTouches[0];
            joyTouchId = touch.identifier;
            handleJoystickMove(touch.clientX, touch.clientY);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (joyTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    handleJoystickMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
                    break;
                }
            }
        }, { passive: false });

        function resetJoystick(e) {
            if (joyTouchId === null) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    joyTouchId = null;
                    joyKnob.style.transform = 'translate(0px, 0px)';
                    input.moveX = 0;
                    input.moveZ = 0;
                    break;

        function formatNum(n) {
            if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
            return Math.floor(n).toString();
        }

        function spawnFloatingUI(text, color = '#facc15', worldPos = null) {
            const el = document.createElement('div');
            el.className = 'floating-pop text-stroke text-lg sm:text-xl';
            el.style.color = color;
            el.textContent = text;

            let sx = window.innerWidth / 2;
            let sy = window.innerHeight * 0.45;
            if (worldPos) {
                const v = worldPos.clone().project(camera);
                sx = (v.x * 0.5 + 0.5) * window.innerWidth;
                sy = (-v.y * 0.5 + 0.5) * window.innerHeight;
            }
            el.style.left = `${sx}px`;
            el.style.top = `${sy}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 900);
        }

            const box = document.getElementById('toast-box');
            document.getElementById('toast-text').textContent = msg;
            box.classList.remove('opacity-0', 'translate-y-4');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                box.classList.add('opacity-0', 'translate-y-4');
            }, 2200);
        }

        function updateHUD() {
            const bagTier = BAG_TIERS[state.bagLevel] || BAG_TIERS[0];
            document.getElementById('ui-coins').textContent = formatNum(state.coins);
            document.getElementById('shop-coins').textContent = formatNum(state.coins);

            // Ранг
            let currentRank = RANKS[0].title;
            for (const r of RANKS) {
                if (state.totalEarned >= r.minEarned) currentRank = r.title;
            }
            document.getElementById('ui-rank').textContent = currentRank;

            // Рюкзак
            const pct = Math.min(100, Math.round((state.bagLoad / bagTier.cap) * 100));
            document.getElementById('ui-bag-text').textContent = `${state.bagLoad} / ${bagTier.cap}`;
            const bar = document.getElementById('ui-bag-bar');
            bar.style.width = `${pct}%`;

            const fullHint = document.getElementById('ui-bag-full-hint');
            const navPill = document.getElementById('ui-nav-pill');
            if (state.bagLoad >= bagTier.cap) {
                fullHint.classList.remove('hidden');
                navPill.classList.remove('hidden');
                bar.className = 'h-full rounded-full transition-all duration-150 bg-gradient-to-r from-rose-500 to-amber-500';
            } else {
                fullHint.classList.add('hidden');
                if (state.bagLoad > 0) {
                    navPill.classList.add('hidden');
                }
                bar.className = 'h-full rounded-full transition-all duration-150 bg-gradient-to-r from-amber-500 via-yellow-400 to-lime-400';
            }
        }

        // Логика Магазина
        const shopModal = document.getElementById('shop-modal');
        let shopWasTriggeredByZone = false;

        function openShop() {
            renderShopItems();
            shopModal.classList.remove('hidden');
            shopModal.classList.add('flex');
            triggerHaptic('medium');
        }

        function closeShop() {
            shopModal.classList.add('hidden');
            shopModal.classList.remove('flex');
        }

        document.getElementById('btn-open-shop').addEventListener('click', openShop);
        document.getElementById('btn-close-shop').addEventListener('click', closeShop);

        document.getElementById('btn-sound').addEventListener('click', (e) => {
            sfx.enabled = !sfx.enabled;
            e.currentTarget.textContent = sfx.enabled ? '🔊' : '🔇';
            if (sfx.enabled) sfx.playPop(1.2);
        });

        document.getElementById('btn-reset-save').addEventListener('click', () => {
            localStorage.removeItem(SAVE_KEY);
            state = { coins: 0, totalEarned: 0, bagLoad: 0, bagLevel: 0, toolLevel: 0, bootLevel: 0, petLevel: 0 };
            updatePlayerVisuals();
            updateHUD();
            renderShopItems();
            showToast('Прогресс сброшен!');
        });

        function renderShopItems() {
            const list = document.getElementById('shop-items-list');
            list.innerHTML = '';

            const categories = [
                {
                    key: 'bagLevel',
                    icon: '🎒',
                    title: 'Рюкзак',
                    tiers: BAG_TIERS,
                    descFn: (t) => `Вместимость: ${t.cap} ед.`
                },
                {
                    key: 'toolLevel',
                    icon: '🧹',
                    title: 'Совок / Пылесос',
                    tiers: TOOL_TIERS,
                    descFn: (t) => `Радиус: ${t.radius}м • Доход x${t.mult}`
                },
                {
                    key: 'bootLevel',
                    icon: '👟',
                    title: 'Скоростные Ботинки',
                    tiers: BOOT_TIERS,
                    descFn: (t) => `Скорость бега: ${t.speed}`
                },
                {
                    key: 'petLevel',
                    icon: '🐶',
                    title: 'Питомец-Помощник',
                    tiers: PET_TIERS,
                    descFn: (t) => t.autoCollect ? `Авто-сбор + Монеты x${t.mult}` : 'Помогает собирать кучки'
                }
            ];

            categories.forEach((cat) => {
                const lvl = state[cat.key];
                const current = cat.tiers[lvl];
                const next = cat.tiers[lvl + 1];

                const card = document.createElement('div');
                card.className = 'bg-slate-800/90 border-2 border-slate-700 rounded-2xl p-3 flex items-center justify-between gap-2';

                const info = document.createElement('div');
                info.className = 'flex items-center gap-2.5';
                info.innerHTML = `
                    <div class="w-11 h-11 rounded-xl bg-slate-900 border border-slate-600 flex items-center justify-center text-2xl shrink-0">
                        ${cat.icon}
                    </div>
                    <div>
                        <div class="text-xs font-bold text-amber-300 uppercase">${cat.title} (Ур. ${lvl + 1}/${cat.tiers.length})</div>
                        <div class="text-sm font-black text-white">${current.name}</div>
                        <div class="text-[11px] text-slate-300">${next ? `След: ${next.name} (${cat.descFn(next)})` : 'МАКСИМАЛЬНЫЙ УРОВЕНЬ!'}</div>
                    </div>
                `;
                card.appendChild(info);

                const btn = document.createElement('button');
                if (!next) {
                    btn.className = 'px-3 py-2 rounded-xl bg-slate-700 text-slate-400 font-black text-xs shrink-0';
                    btn.textContent = 'МАКС';
                    btn.disabled = true;
                } else {
                    const canBuy = state.coins >= next.cost;
                    btn.className = `rbx-btn px-3 py-2 rounded-xl font-black text-xs shrink-0 flex flex-col items-center ${
                        canBuy
                            ? 'bg-emerald-500 hover:bg-emerald-400 border-emerald-700 text-white'
                            : 'bg-slate-700 border-slate-900 text-slate-400 opacity-75'
                    }`;
                    btn.innerHTML = `<span>КУПИТЬ</span><span class="text-amber-200">🪙 ${formatNum(next.cost)}</span>`;
                    btn.onclick = () => {
                        if (state.coins < next.cost) {
                            triggerHaptic('error');
                            showToast('Не хватает монет! Собери ещё кучек!');
                            return;
                        }
                        state.coins -= next.cost;
                        state[cat.key]++;
                        sfx.playUpgrade();
                        triggerHaptic('success');
                        saveGame();
                        updatePlayerVisuals();
                        updateHUD();
                        renderShopItems();
                        showToast(`Куплено: ${next.name}!`);
                    };
                }
                card.appendChild(btn);
                list.appendChild(card);
            });
        }

        /**
         * ============================================================================
         * 11. ГЛАВНЫЙ ИГРОВОЙ ЦИКЛ (ФИЗИКА, СБОР, ПЕРЕРАБОТКА, ПИТОМЕЦ, КАМЕРА)
         * ============================================================================
         */
        let clock = new THREE.Clock();
        let walkCycle = 0;
        let swingTimer = 0;
        let sellCooldown = 0;
        let spawnTimer = 0;
        let petCollectTimer = 0;

        function collectPoopAtIndex(idx, collectorPos) {
            const p = poops[idx];
            const bagTier = BAG_TIERS[state.bagLevel] || BAG_TIERS[0];
            if (state.bagLoad >= bagTier.cap) return false;

            const added = Math.min(p.type.weight, bagTier.cap - state.bagLoad);
            state.bagLoad += added;
            swingTimer = 0.25;

            sfx.playPop(p.type.id === 'normal' ? 1 : p.type.id === 'golden' ? 1.35 : 1.6);
            triggerHaptic(p.type.id === 'normal' ? 'light' : 'medium');

            spawnBurst(p.x, 0.5, p.z, p.type.color, p.type.id === 'normal' ? 6 : 12);
            spawnFloatingUI(
                `+${added} 💩`,
                p.type.id === 'golden' ? '#facc15' : p.type.id === 'toxic' ? '#a3e635' : '#ffffff',
                new THREE.Vector3(p.x, 1.5, p.z)
            );

            scene.remove(p.mesh);
            poops.splice(idx, 1);

            updatePlayerVisuals();
            updateHUD();
            saveGame();
            return true;
        }

        function processSellZone(dt) {
            if (sellCooldown > 0) {
                sellCooldown -= dt;
                return;
            }
            const distToSell = Math.hypot(player.position.x - SELL_ZONE.x, player.position.z - SELL_ZONE.z);
            if (distToSell <= SELL_ZONE.radius && state.bagLoad > 0) {
                const toolTier = TOOL_TIERS[state.toolLevel] || TOOL_TIERS[0];
                const petTier = PET_TIERS[state.petLevel] || PET_TIERS[0];

                // Конвертация груза в монеты с учётом множителей инструмента и питомца
                const reward = Math.max(1, Math.round(state.bagLoad * 3 * toolTier.mult * petTier.mult));
                state.coins += reward;
                state.totalEarned += reward;
                state.bagLoad = 0;
                sellCooldown = 0.4;

                sfx.playCoin();
                triggerHaptic('success');
                spawnBurst(SELL_ZONE.x, 1.2, SELL_ZONE.z, 0xfacc15, 16);
                spawnFloatingUI(`+${formatNum(reward)} 🪙`, '#4ade80', new THREE.Vector3(player.position.x, 3.6, player.position.z));

                updatePlayerVisuals();
                updateHUD();
                saveGame();
            }
        }

        function checkShopZone() {
            const distToShop = Math.hypot(player.position.x - SHOP_ZONE.x, player.position.z - SHOP_ZONE.z);
            if (distToShop <= SHOP_ZONE.radius) {
                if (!shopWasTriggeredByZone) {
                    shopWasTriggeredByZone = true;
                    openShop();
                }
            } else {
                shopWasTriggeredByZone = false;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.elapsedTime;

            updateKeyboardInput();

            // 1. Движение игрока
            const bootTier = BOOT_TIERS[state.bootLevel] || BOOT_TIERS[0];
            const speedMult = input.boostActive ? 1.48 : 1.0;
            const moveSpeed = bootTier.speed * speedMult;

            const isMoving = Math.hypot(input.moveX, input.moveZ) > 0.08;
            if (isMoving) {
                let nextX = player.position.x + input.moveX * moveSpeed * dt;
                let nextZ = player.position.z + input.moveZ * moveSpeed * dt;

                // Границы парка
                nextX = Math.max(-WORLD_RADIUS + 1.2, Math.min(WORLD_RADIUS - 1.2, nextX));
                nextZ = Math.max(-WORLD_RADIUS + 1.2, Math.min(WORLD_RADIUS - 1.2, nextZ));

                // Коллизии с деревьями и домиками
                for (const obs of obstacles) {
                    const dx = nextX - obs.x;
                    const dz = nextZ - obs.z;
                    const d = Math.hypot(dx, dz);
                    const minD = obs.r + 0.7;
                    if (d < minD && d > 0.001) {
                        nextX = obs.x + (dx / d) * minD;
                        nextZ = obs.z + (dz / d) * minD;
                    }
                }

                player.position.x = nextX;
                player.position.z = nextZ;

                // Плавный поворот персонажа в сторону бега
                const targetAngle = Math.atan2(input.moveX, input.moveZ);
                let diff = targetAngle - player.rotation.y;
                while (diff < -Math.PI) diff += Math.PI * 2;
                while (diff > Math.PI) diff -= Math.PI * 2;
                player.rotation.y += diff * Math.min(1, dt * 14);

                // Анимация бега (ноги и руки в стиле Roblox)
                walkCycle += dt * moveSpeed * 1.15;
                leftLeg.rotation.x = Math.sin(walkCycle) * 0.75;
                rightLeg.rotation.x = -Math.sin(walkCycle) * 0.75;
                leftArm.rotation.x = -Math.sin(walkCycle) * 0.65;
                if (swingTimer <= 0) {
                    rightArmGroup.rotation.x = Math.sin(walkCycle) * 0.65;
                }
            } else {
                // Возврат конечностей в покой
                leftLeg.rotation.x *= 0.8;
                rightLeg.rotation.x *= 0.8;
                leftArm.rotation.x *= 0.8;
                if (swingTimer <= 0) rightArmGroup.rotation.x *= 0.8;
            }

            // Взмах совком при подборе
            if (swingTimer > 0) {
                swingTimer -= dt;
                rightArmGroup.rotation.x = -1.35;
            }

            // 2. Физика прыжка
            if (!isGrounded || playerVelY > 0) {
                player.position.y += playerVelY * dt;
                playerVelY -= 34 * dt; // гравитация
                if (player.position.y <= 0) {
                    player.position.y = 0;
                    playerVelY = 0;
                    isGrounded = true;
                }
            }

            // 3. Сбор кучек игроком
            const toolTier = TOOL_TIERS[state.toolLevel] || TOOL_TIERS[0];
            const bagTier = BAG_TIERS[state.bagLevel] || BAG_TIERS[0];

            for (let i = poops.length - 1; i >= 0; i--) {
                const p = poops[i];
                // Анимация покачивания и мух
                p.mesh.rotation.y = Math.sin(elapsed * 2 + p.phase) * 0.25;
                if (p.mesh.userData.flies) {
                    p.mesh.userData.flies[0].position.x = Math.cos(elapsed * 6 + p.phase) * 0.65;
                    p.mesh.userData.flies[0].position.z = Math.sin(elapsed * 6 + p.phase) * 0.65;
                    p.mesh.userData.flies[1].position.x = Math.cos(-elapsed * 5 + p.phase) * 0.65;
                    p.mesh.userData.flies[1].position.z = Math.sin(-elapsed * 5 + p.phase) * 0.65;
                }

                // Проверка дистанции сбора
                const dist = Math.hypot(player.position.x - p.x, player.position.z - p.z);
                if (dist <= toolTier.radius && state.bagLoad < bagTier.cap) {
                    collectPoopAtIndex(i, player.position);
                }
            }

            // 4. Поведение Питомца (летает рядом и сам подбирает кучки)
            if (state.petLevel > 0) {
                const targetPetX = player.position.x - Math.cos(player.rotation.y) * 1.8;
                const targetPetZ = player.position.z + Math.sin(player.rotation.y) * 1.8;
                petGroup.position.x += (targetPetX - petGroup.position.x) * Math.min(1, dt * 5);
                petGroup.position.z += (targetPetZ - petGroup.position.z) * Math.min(1, dt * 5);
                petGroup.position.y = 1.6 + Math.sin(elapsed * 5) * 0.25;
                petGroup.rotation.y = player.rotation.y;

                petCollectTimer -= dt;
                if (petCollectTimer <= 0 && state.bagLoad < bagTier.cap && poops.length > 0) {
                    petCollectTimer = 1.4;
                    // Ищем ближайшую кучку в радиусе 8м
                    let bestIdx = -1;
                    let bestD = 8.5;
                    for (let i = 0; i < poops.length; i++) {
                        const d = Math.hypot(player.position.x - poops[i].x, player.position.z - poops[i].z);
                        if (d < bestD) {
                            bestD = d;
                            bestIdx = i;
                        }
                    }
                    if (bestIdx !== -1) {
                        petGroup.position.x = poops[bestIdx].x;
                        petGroup.position.z = poops[bestIdx].z;
                        collectPoopAtIndex(bestIdx, petGroup.position);
                    }
                }
            }

            // 5. Проверка зон (Переработка и Магазин)
            processSellZone(dt);
            checkShopZone();

            // Анимация пульсации светящихся колец зон
            const pulse = 1 + Math.sin(elapsed * 4) * 0.04;
            sellRing.scale.set(pulse, pulse, 1);
            shopRing.scale.set(pulse, pulse, 1);

            // 6. Периодический спавн новых кучек
            spawnTimer += dt;
            if (spawnTimer >= 1.1) {
                spawnTimer = 0;
                spawnPoop();
            }

            // 7. Обновление частиц
            for (let i = particles.length - 1; i >= 0; i--) {
                const pt = particles[i];
                pt.life -= dt;
                pt.mesh.position.x += pt.vx * dt;
                pt.mesh.position.y += pt.vy * dt;
                pt.mesh.position.z += pt.vz * dt;
                pt.vy -= 18 * dt;
                pt.mesh.scale.setScalar(Math.max(0.01, pt.life * 1.8));
                if (pt.life <= 0) {
                    scene.remove(pt.mesh);
                    particles.splice(i, 1);
                }
            }

            // 8. Плавное слежение изометрической Roblox-камеры за персонажем
            const isPortrait = window.innerHeight > window.innerWidth;
            const camOffsetY = isPortrait ? 19 : 15;
            const camOffsetZ = isPortrait ? 20 : 16;

            camera.position.x += (player.position.x - camera.position.x) * Math.min(1, dt * 6);
            camera.position.y += (player.position.y + camOffsetY - camera.position.y) * Math.min(1, dt * 6);
            camera.position.z += (player.position.z + camOffsetZ - camera.position.z) * Math.min(1, dt * 6);
            camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z - 1.5);

            renderer.render(scene, camera);
        }

        // Адаптация при изменении размера окна / повороте экрана в Telegram
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Первичная инициализация интерфейса и запуск
        window.onload = function () {
            updatePlayerVisuals();
            updateHUD();
            animate();
        };
    </script>
</body>
